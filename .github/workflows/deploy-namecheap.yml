name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VITE_BOTSYNC_API_URL: ${{ secrets.VITE_BOTSYNC_API_URL }}
      SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
      SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
      SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
      APP_ROOT: ${{ secrets.NAMECHEAP_APP_ROOT }}
      HEALTHCHECK_URL: ${{ secrets.NAMECHEAP_HEALTHCHECK_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}
        run: |
          printf '%s' "$RELEASE_ID" > public/__release.txt
          npm run build

      - name: Package release
        run: tar -czf deployment.tgz .output

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$APP_ROOT"
          test -n "$HEALTHCHECK_URL"
          test -n "$VITE_BOTSYNC_API_URL"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          SSH_PORT="${SSH_PORT:-21098}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          case "$APP_ROOT" in /home/*/*) ;; *) echo "Unsafe NAMECHEAP_APP_ROOT" >&2; exit 1;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/namecheap
          chmod 600 ~/.ssh/namecheap
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release without changing live site
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}
        run: |
          printf -v mkdir_command 'mkdir -p %q' "$APP_ROOT/incoming"
          ssh -i ~/.ssh/namecheap -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$mkdir_command"
          scp -i ~/.ssh/namecheap -P "$SSH_PORT" deployment.tgz "$SSH_USER@$SSH_HOST:$APP_ROOT/incoming/$RELEASE_ID.tgz"

      - name: Activate, verify, and roll back on failure
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}
        run: |
          printf -v deploy_command 'bash -s -- %q %q %q' "$APP_ROOT" "$RELEASE_ID" "$HEALTHCHECK_URL"
          ssh -i ~/.ssh/namecheap -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$deploy_command" < .github/scripts/deploy-namecheap.sh
